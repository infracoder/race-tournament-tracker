<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Organizer - Mario Kart Tournament</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="header">
        <h1>🎮 Organizer Dashboard</h1>
        <p>Tournament Management</p>
    </div>

    <div class="container">
        <!-- Login Form -->
        <div id="loginCard" class="card">
            <div class="card-header">
                <h2 class="card-title">🔐 Organizer Login</h2>
            </div>

            <div class="info-box">
                <p>Enter the organizer PIN to access tournament management.</p>
            </div>

            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label for="pin" class="form-label">PIN</label>
                    <input 
                        type="password" 
                        id="pin" 
                        name="pin" 
                        class="form-input" 
                        placeholder="Enter PIN" 
                        required
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="off">
                </div>

                <button type="submit" class="btn btn-primary btn-large btn-block" id="loginBtn">
                    🔓 Login
                </button>
            </form>

            <div id="loginMessage" class="mt-20 hidden"></div>

            <div class="mt-20">
                <a href="/" class="btn btn-secondary btn-block">
                    ← Back to Home
                </a>
            </div>
        </div>

        <!-- Dashboard Content (shown after login) -->
        <div id="dashboardContent" class="hidden">
            <!-- Tournament Controls -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">⚙️ Tournament Controls</h2>
                </div>

                <div class="grid grid-2">
                    <button onclick="initializeTournament()" class="btn btn-warning btn-large btn-block" id="initBtn">
                        🔄 Initialize Tournament
                    </button>
                    <button onclick="completeTournament()" class="btn btn-success btn-large btn-block" id="completeBtn">
                        🏁 Complete Tournament
                    </button>
                </div>

                <div class="mt-20">
                    <button onclick="resetTournament()" class="btn btn-large btn-block" style="background-color: #d32f2f; color: white;">
                        ⚠️ Reset Tournament (Delete All Data)
                    </button>
                </div>

                <div class="grid grid-2 mt-20">
                    <a href="/" class="btn btn-secondary btn-block">
                        🏠 Home
                    </a>
                    <button onclick="logout()" class="btn btn-secondary btn-block">
                        🚺 Logout
                    </button>
                </div>

                <div id="controlMessage" class="mt-20 hidden"></div>
                
                <!-- Tournament Info -->
                <div id="tournamentInfo" class="info-box mt-20 hidden">
                    <strong>Tournament Configuration:</strong><br>
                    <span id="tournamentDetails"></span>
                </div>
            </div>

            <!-- Registered Players -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">👥 Registered Players</h2>
                </div>

                <div id="registeredPlayers">
                    <div class="loading-container">
                        <div class="loading"></div>
                    </div>
                </div>
            </div>

            <!-- Live Leaderboard -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">🏆 Live Leaderboard</h2>
                </div>

                <div id="miniLeaderboard" class="leaderboard-table">
                    <div class="loading-container">
                        <div class="loading"></div>
                    </div>
                </div>
            </div>

            <!-- Race Results Entry -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">🏁 Race Results</h2>
                </div>

                <div id="racesLoading" class="loading-container">
                    <div class="loading"></div>
                </div>

                <div id="racesContent" class="hidden">
                    <div class="form-group">
                        <label for="raceSelect" class="form-label">Select Race to Enter Results</label>
                        <select id="raceSelect" class="form-select" onchange="selectRace()">
                            <option value="">-- Select a race --</option>
                        </select>
                    </div>

                    <div id="selectedRaceContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval = null;
        let allRaces = [];
        let tournamentConfig = { players_per_race: 4 }; // Cache tournament config

        async function login(event) {
            event.preventDefault();
            
            const pin = document.getElementById('pin').value;
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('loginMessage');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            messageDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/organizer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                    loadDashboard();
                    startRefresh();
                } else {
                    showMessage(messageDiv, data.error || 'Invalid PIN', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🔓 Login';
                }
            } catch (error) {
                showMessage(messageDiv, 'Network error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '🔓 Login';
            }
        }

        async function logout() {
            try {
                await fetch('/api/organizer/logout', { method: 'POST' });
                stopRefresh();
                document.getElementById('dashboardContent').classList.add('hidden');
                document.getElementById('loginCard').classList.remove('hidden');
                
                // Reset login form
                const loginBtn = document.getElementById('loginBtn');
                const messageDiv = document.getElementById('loginMessage');
                document.getElementById('pin').value = '';
                loginBtn.disabled = false;
                loginBtn.textContent = '🔓 Login';
                messageDiv.classList.add('hidden');
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        async function resetTournament() {
            if (!confirm('⚠️ WARNING: This will DELETE ALL tournament data including:\n\n- All registered players\n- All race results\n- Tournament status\n\nThis action CANNOT be undone!\n\nAre you sure you want to reset the tournament?')) return;
            
            // Double confirmation
            if (!confirm('Are you ABSOLUTELY sure? This will erase everything!')) return;

            const messageDiv = document.getElementById('controlMessage');
            try {
                const response = await fetch('/api/tournament/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, '✅ Tournament reset successfully! Ready for new players.', 'success');
                    loadDashboard();
                } else {
                    showMessage(messageDiv, data.error || 'Failed to reset tournament', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'Network error', 'error');
            }
        }

        async function initializeTournament() {
            // Get player count from localStorage or default to 9
            const lastPlayerCount = localStorage.getItem('mk_player_count') || '9';
            const lastPlayersPerRace = localStorage.getItem('mk_players_per_race') || '4';
            
            // Prompt for player count
            const playerCountStr = prompt(
                'How many players will participate in the tournament?\n\nEnter 8, 9, or 10:',
                lastPlayerCount
            );
            
            if (!playerCountStr) return; // User cancelled
            
            const playerCount = parseInt(playerCountStr, 10);
            
            // Validate
            if (isNaN(playerCount) || ![8, 9, 10].includes(playerCount)) {
                alert('Invalid player count. Please enter 8, 9, or 10.');
                return;
            }
            
            // Prompt for players per race
            const playersPerRaceStr = prompt(
                'How many players per race?\n\n2 = Smaller TV screens (good for split-screen)\n4 = Standard (default)\n\nEnter 2 or 4:',
                lastPlayersPerRace
            );
            
            if (!playersPerRaceStr) return; // User cancelled
            
            const playersPerRace = parseInt(playersPerRaceStr, 10);
            
            // Validate
            if (isNaN(playersPerRace) || ![2, 4].includes(playersPerRace)) {
                alert('Invalid players per race. Please enter 2 or 4.');
                return;
            }
            
            const totalRaces = (playerCount * 4) / playersPerRace;
            
            if (!confirm(`Initialize tournament:\n\n• ${playerCount} players\n• ${playersPerRace} players per race\n• ${totalRaces} total races\n\nThis will reset all data!`)) return;
            
            // Save preferences
            localStorage.setItem('mk_player_count', playerCount.toString());
            localStorage.setItem('mk_players_per_race', playersPerRace.toString());

            const messageDiv = document.getElementById('controlMessage');
            try {
                const response = await fetch('/api/tournament/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_count: playerCount, players_per_race: playersPerRace })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, data.message, 'success');
                    loadDashboard();
                } else {
                    showMessage(messageDiv, data.error || 'Failed to initialize', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'Network error', 'error');
            }
        }

        async function completeTournament() {
            if (!confirm('Mark tournament as complete and declare winner?')) return;

            const messageDiv = document.getElementById('controlMessage');
            try {
                const response = await fetch('/api/tournament/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, `🏆 Winner: ${data.winner.name} (${data.winner.points} pts)`, 'success');
                    loadDashboard();
                } else {
                    showMessage(messageDiv, data.error || 'Failed to complete', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'Network error', 'error');
            }
        }

        async function loadDashboard() {
            try {
                const [racesRes, leaderboardRes, playersRes, statusRes] = await Promise.all([
                    fetch('/api/races'),
                    fetch('/api/players/leaderboard'),
                    fetch('/api/players'),
                    fetch('/api/tournament/status')
                ]);

                const racesData = await racesRes.json();
                const leaderboardData = await leaderboardRes.json();
                const playersData = await playersRes.json();
                const status = await statusRes.json();

                allRaces = racesData.races || [];
                tournamentConfig = { players_per_race: status.players_per_race || 4 }; // Cache config

                renderRegisteredPlayers(playersData);
                renderRaces();
                renderLeaderboard(leaderboardData.standings || []);
                updateTournamentInfo(status);
                
                // Update button states
                updateButtonStates(status, playersData);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        function updateTournamentInfo(status) {
            const infoDiv = document.getElementById('tournamentInfo');
            const detailsSpan = document.getElementById('tournamentDetails');
            
            if (status.initialized === false) {
                infoDiv.classList.add('hidden');
                return;
            }
            
            infoDiv.classList.remove('hidden');
            detailsSpan.innerHTML = `
                🎮 <strong>${status.player_count || 9}</strong> players &nbsp;&nbsp;
                👥 <strong>${status.players_per_race || 4}</strong> per race &nbsp;&nbsp;
                🏁 <strong>${status.total_races || 9}</strong> races &nbsp;&nbsp;
                📊 <strong>${status.races_completed || 0}</strong> completed
            `;
        }

        function renderRaces() {
            const select = document.getElementById('raceSelect');
            
            // Populate race dropdown
            select.innerHTML = '<option value="">-- Select a race --</option>' +
                allRaces.map(race => {
                    const status = race.completed ? '✓ Completed' : '⏳ Pending';
                    return `<option value="${race.race_number}">Race ${race.race_number} - ${status}</option>`;
                }).join('');

            document.getElementById('racesLoading').classList.add('hidden');
            document.getElementById('racesContent').classList.remove('hidden');
        }

        function selectRace() {
            const raceNumber = parseInt(document.getElementById('raceSelect').value);
            const contentDiv = document.getElementById('selectedRaceContent');
            
            if (!raceNumber) {
                contentDiv.innerHTML = '';
                return;
            }

            const race = allRaces.find(r => r.race_number === raceNumber);
            if (!race) return;

            const isCompleted = race.completed;
            const playersPerRace = tournamentConfig.players_per_race || 4;
            
            // Generate position options based on playersPerRace
            const getPointsMap = (ppr) => ppr === 2 ? {1: 25, 2: 18} : {1: 25, 2: 18, 3: 15, 4: 12};
            const pointsMap = getPointsMap(playersPerRace);
            const positionOptions = [];
            for (let i = 1; i <= playersPerRace; i++) {
                const medal = i === 1 ? '🥇' : i === 2 ? '🥈' : i === 3 ? '🥉' : '';
                const suffix = i === 1 ? 'st' : i === 2 ? 'nd' : i === 3 ? 'rd' : 'th';
                positionOptions.push(`<option value="${i}">${medal} ${i}${suffix} Place (${pointsMap[i]} points)</option>`);
            }

            contentDiv.innerHTML = `
                <div class="race-card ${isCompleted ? 'completed' : ''}" style="margin-top: 20px;">
                    <div class="race-card-header">
                        <span class="race-number">Race ${race.race_number}</span>
                        <span class="race-status ${isCompleted ? 'completed' : 'pending'}">
                            ${isCompleted ? '✓ Completed' : '⏳ Pending'}
                        </span>
                    </div>

                    <div class="race-participants">
                        <h3 style="font-size: 16px; margin: 15px 0 10px 0; color: #0066CC;">Racers:</h3>
                        ${race.participants.map(p => `
                            <div class="participant">
                                <span>${p.name || 'Not Registered'}</span>
                            </div>
                        `).join('')}
                    </div>

                    ${!isCompleted ? `
                        <form onsubmit="submitRaceResult(event, ${race.race_number})" id="raceForm${race.race_number}">
                            <div style="margin-top: 20px;">
                                <h3 style="font-size: 16px; margin-bottom: 15px; color: #E60012;">Enter Race Results:</h3>
                                ${race.participants.map(p => `
                                    <div class="form-group">
                                        <label class="form-label" style="font-size: 18px;">
                                            <strong style="color: #0066CC;">${p.name || 'Not Registered'}</strong>
                                        </label>
                                        <select class="form-select" name="pos_${p.id}" required ${!p.name ? 'disabled' : ''}>
                                            <option value="">-- Select Finish Place --</option>
                                            ${positionOptions.join('')}
                                        </select>
                                        ${!p.name ? '<small style="color: #E60012;">⚠️ Player not registered yet</small>' : ''}
                                    </div>
                                `).join('')}
                            </div>
                            <button type="submit" class="btn btn-success btn-large btn-block" ${race.participants.some(p => !p.name) ? 'disabled title="All players must be registered first"' : ''}>
                                ✓ Submit Results for Race ${race.race_number}
                            </button>
                            <div class="race-message mt-20 hidden"></div>
                        </form>
                    ` : `
                        <div class="alert alert-success mt-20">
                            <strong>✓ This race has been completed.</strong>
                        </div>
                    `}
                </div>
            `;
        }

        async function submitRaceResult(event, raceNumber) {
            event.preventDefault();
            
            const form = event.target;
            const messageDiv = form.querySelector('.race-message');
            const submitBtn = form.querySelector('button[type="submit"]');
            
            // Get all positions
            const race = allRaces.find(r => r.race_number === raceNumber);
            const placements = [];

            for (const participant of race.participants) {
                const position = parseInt(form[`pos_${participant.id}`].value);
                placements.push({
                    player_id: participant.id,
                    position: position
                });
            }

            // Validate all positions are selected
            if (placements.some(p => isNaN(p.position))) {
                showMessage(messageDiv, 'Please select a position for all players!', 'error');
                return;
            }
            
            // Validate unique positions
            const positions = placements.map(p => p.position);
            const playersPerRace = tournamentConfig.players_per_race || 4;
            if (new Set(positions).size !== playersPerRace) {
                showMessage(messageDiv, 'Each position must be unique!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const response = await fetch('/api/race/result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ race_number: raceNumber, placements })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, '✓ Results submitted!', 'success');
                    submitBtn.textContent = '✓ Success!';
                    submitBtn.style.backgroundColor = '#00A650';
                    setTimeout(() => {
                        // Reset the race dropdown and clear selected content
                        document.getElementById('raceSelect').value = '';
                        document.getElementById('selectedRaceContent').innerHTML = '';
                        loadDashboard();
                    }, 1500);
                } else {
                    showMessage(messageDiv, data.error || 'Submission failed', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✓ Submit Results';
                }
            } catch (error) {
                showMessage(messageDiv, 'Network error', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✓ Submit Results';
            }
        }

        function renderRegisteredPlayers(playersData) {
            const container = document.getElementById('registeredPlayers');
            const players = playersData.players || [];
            
            if (players.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <strong>⚠️ No players registered yet.</strong><br>
                        Share the registration link with players: <code>${window.location.origin}/register.html</code>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${playersData.registered}</div>
                        <div class="stat-label">Registered</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${playersData.available}</div>
                        <div class="stat-label">Slots Available</div>
                    </div>
                </div>
                <div style="margin-top: 20px; display: grid; gap: 10px;">
                    ${players.map(p => `
                        <div class="participant">
                            <span>${p.name}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderLeaderboard(standings) {
            const container = document.getElementById('miniLeaderboard');
            
            if (standings.length === 0) {
                container.innerHTML = `<div class="alert alert-info">No race results yet. Standings will appear after races are completed.</div>`;
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Points</th>
                            <th class="hide-mobile">1st</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${standings.map(p => `
                            <tr>
                                <td>${p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : p.rank}</td>
                                <td><strong>${p.name}</strong></td>
                                <td><strong style="color: #E60012;">${p.total_points}</strong></td>
                                <td class="hide-mobile">${p.firsts}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateButtonStates(status, playersData) {
            const initBtn = document.getElementById('initBtn');
            const completeBtn = document.getElementById('completeBtn');
            
            // Disable init button if tournament already has players or races
            if (playersData.registered > 0 || (status.races_completed && status.races_completed > 0)) {
                initBtn.disabled = true;
                initBtn.style.opacity = '0.5';
                initBtn.title = 'Cannot initialize - tournament has data';
            } else {
                initBtn.disabled = false;
                initBtn.style.opacity = '1';
                initBtn.title = '';
            }
            
            // Enable complete button only if all races done
            if (status.races_completed === status.total_races && status.status !== 'completed') {
                completeBtn.disabled = false;
                completeBtn.style.opacity = '1';
            } else {
                completeBtn.disabled = true;
                completeBtn.style.opacity = '0.5';
            }
        }
        
        function showMessage(element, message, type) {
            if (!element) return; // Element no longer exists
            element.className = `alert alert-${type}`;
            element.textContent = message;
            element.classList.remove('hidden');
        }

        function startRefresh() {
            refreshInterval = setInterval(loadDashboard, 5000);
        }

        function stopRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/organizer/check');
                const data = await response.json();

                if (data.authenticated) {
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                    loadDashboard();
                    startRefresh();
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Check auth on page load
        checkAuth();

        // Cleanup on page unload
        window.addEventListener('beforeunload', stopRefresh);
    </script>
</body>
</html>
